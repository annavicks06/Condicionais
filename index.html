<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Calculadora</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <section class="container">
        <h1>Calculadora Soma</h1>
       <input type="number" id="numero1" placeholder="Digite o primeiro número">
        <input type="number" id="numero2" placeholder="Digite o segundo número">
 
        <button onclick="somar()">Calcular Soma</button>
 
        <h2 id="resultado1">Resultado:</h2>
    </section>
    <section class="container">
        <h1>Converter Celsius para Fahrenheit</h1>
 
        <input type="number" id="celsius" placeholder="Digite a temperatura">
 
        <button onclick="converter()">Converter</button>
 
        <h2 id="resultado2">Resultado</h2>
    </section>
 
    <section class="container">
        <h1>Calcule o Volume</h1>
 
        <input type="number" id="numer1" placeholder="Digite o raio">
        <input type="number" id="numer2" placeholder="Digite a altura" >
 
        <h2 id = "V">Resultado</h2>
 
        <button onclick="calcular()">Calcular</button>
</section>
     
<section class="container">
            <h1>Calcule o Volume 2</h1>
 
            <input type="number" id="nume1" placeholder="Digite o comprimento">
            <input type="number" id="nume2" placeholder="Digite a largura">
            <input type="number" id="nume3" placeholder="Digite a altura">
 
            <h2 id="result">Resultado</h2>

            <button onclick="calcularVolume2()">Calcular</button>
        </section>
 
   
    <script src="javascript/script.js"></script>
</body>
</html>
